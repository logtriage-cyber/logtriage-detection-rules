# Detect Admin Grants and 2-Step Verification Removal in Google Workspace Audit Logs
# Rule ID: LTR-0017
# Source + explanation: https://logtriage.app/rules/google-workspace-admin-takeover/
# Validated against a real sample log (malicious/google_workspace_attack.json): fires on the malicious sample, silent on the benign one.

title: Google Workspace Admin Privilege Grant or 2-Step Verification Removal
id: 5898235a-abe3-4152-b4ee-26642696c381
status: experimental
description: >
  Detects two steps of a Google Workspace admin takeover in the Admin SDK
  Reports API: an account being granted admin privileges
  (GRANT_ADMIN_PRIVILEGE, GRANT_DELEGATED_ADMIN_PRIVILEGES) and 2-Step
  Verification being turned off for a user, by an administrator
  (TURN_OFF_2_STEP_VERIFICATION) or by the user (2sv_disable).
references:
  - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-user-settings
  - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/login
  - https://attack.mitre.org/techniques/T1098/
author: LogTriage
date: 2026/09/18
modified: 2026/10/20
logsource:
  product: google_workspace
detection:
  admin_granted:
    eventName:
      - 'GRANT_ADMIN_PRIVILEGE'
      - 'GRANT_DELEGATED_ADMIN_PRIVILEGES'
  second_step_removed:
    eventName:
      - 'TURN_OFF_2_STEP_VERIFICATION'
      - '2sv_disable'
  condition: admin_granted or second_step_removed
falsepositives:
  - Planned admin appointments (correlate with a ticket)
  - Helpdesk turning off 2-Step Verification for a user who lost their phone
  - Routine delegated admin role grants
level: high
tags:
  - attack.persistence
  - attack.t1098
  - attack.credential_access
  - attack.t1556.006
