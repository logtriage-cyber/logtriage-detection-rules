# Detect Encoded PowerShell, Mimikatz, and Watchlist Alerts in Carbon Black EDR
# Rule ID: LTR-0023
# Source + explanation: https://logtriage.app/rules/carbonblack-credential-dumping-encoded-powershell/
# Validated against a real sample log (malicious/carbonblack_attack.json): fires on the malicious sample, silent on the benign one.

title: Carbon Black — Encoded PowerShell, Credential Dumping, and Watchlist Alerts
id: 9e2f6b1a-4c7d-4a8e-9b3f-1d6a7c2e5f08
status: experimental
description: >
  Detects three high-confidence post-exploitation signals in Carbon Black EDR
  telemetry: a process launched with a base64-encoded PowerShell command line,
  a Mimikatz-style credential-dumping command (privilege::debug /
  sekurlsa::), and any event Carbon Black itself classifies as a watchlist
  hit or alert. Each is independently meaningful — this is not a volume-based
  detection.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1059/001/
author: LogTriage
date: 2026/10/19
logsource:
  product: carbonblack
  category: process_creation
detection:
  encoded_powershell:
    cmdline|contains:
      - '-enc '
      - '-EncodedCommand'
  credential_dumping:
    cmdline|contains:
      - 'sekurlsa::'
      - 'mimikatz'
  watchlist_or_alert:
    type|contains:
      - 'watchlist.hit'
      - 'ingress.event.alert'
  condition: encoded_powershell or credential_dumping or watchlist_or_alert
falsepositives:
  - Deployment/automation tooling passing a payload via -EncodedCommand
  - A benign tool or test file whose path coincidentally contains "mimikatz"
  - A noisy but untriaged custom watchlist producing routine hits
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.execution
  - attack.t1059.001
