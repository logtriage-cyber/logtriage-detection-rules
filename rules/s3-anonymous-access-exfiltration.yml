# Detect Anonymous S3 Object Reads in Server Access Logs
# Rule ID: LTR-0016
# Source + explanation: https://logtriage.app/rules/s3-anonymous-access-exfiltration/
# Validated against a real sample log (malicious/s3_access_attack.log): fires on the malicious sample, silent on the benign one.

title: S3 Anonymous Object Read
id: c9b48814-efc5-4f0c-9d57-2eca393911d2
status: experimental
description: >
  Detects an object download (REST.GET.OBJECT) that S3 served with status 200
  to a request carrying no credentials. S3 server access logs record such a
  request with "-" as the requester, the signature version and the
  authentication type. S3 only serves it when a bucket policy, an ACL or a
  public-access setting allows public reads.
references:
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/LogFormat.html
  - https://attack.mitre.org/techniques/T1530/
author: LogTriage
date: 2026/09/18
modified: 2026/10/20
logsource:
  product: aws
  service: s3
detection:
  object_read:
    operation: 'REST.GET.OBJECT'
    http_status: 200
  anonymous:
    requester: '-'
  signed:
    signature_version:
      - 'SigV2'
      - 'SigV4'
  condition: object_read and anonymous and not signed
falsepositives:
  - Buckets that are public by design (static websites, download mirrors)
  - CloudFront origin fetches without Origin Access Control
level: high
tags:
  - attack.collection
  - attack.t1530
