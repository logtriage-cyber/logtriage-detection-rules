# Detect MFA Fatigue and Bypass Abuse in Duo Security Logs
# Rule ID: LTR-0013
# Source + explanation: https://logtriage.app/rules/duo-mfa-fatigue-bypass/
# Validated against a real sample log (malicious/duo_attack.json): fires on the malicious sample, silent on the benign one.

title: Duo MFA Fatigue, Fraud Report, and Bypass Abuse
id: 6d1a8f34-2c97-4e05-b8d6-91f7a3e4c25b
status: experimental
description: >
  Detects attacks on the second factor in Duo authentication logs: a user
  reporting a push as fraud, Duo's own anomalous-push (push harassment)
  detection, and a login that succeeded with a bypass code or for a user in
  bypass status instead of a real second factor. Any of these means someone
  already has, or is trying to use, the user's password.
references:
  - https://attack.mitre.org/techniques/T1621/
  - https://attack.mitre.org/techniques/T1556/006/
author: LogTriage
date: 2026/08/04
modified: 2026/10/20
logsource:
  product: duo
  service: authentication
detection:
  user_reported_fraud:
    result: 'FRAUD'
    reason: 'user_marked_fraud'
  push_harassment:
    reason: 'anomalous_push'
  bypass_used:
    - factor: 'bypass_code'
      result: 'SUCCESS'
    - reason: 'bypass_user'
  condition: user_reported_fraud or push_harassment or bypass_used
falsepositives:
  - Helpdesk-issued bypass code during phone replacement (correlate with a ticket)
  - User temporarily set to bypass status by an administrator
  - A push reported as fraud by mistake
level: high
tags:
  - attack.credential_access
  - attack.t1621
  - attack.defense_evasion
  - attack.t1556.006
