# Detect Mimikatz Credential Dumping in Carbon Black EDR Process Events
# Rule ID: LTR-0023
# Source + explanation: https://logtriage.app/rules/carbonblack-mimikatz-credential-dumping/
# Validated against a real sample log (malicious/carbonblack_attack.json): fires on the malicious sample, silent on the benign one.

title: Mimikatz Credential Dumping in Carbon Black EDR
id: 9e2f6b1a-4c7d-4a8e-9b3f-1d6a7c2e5f08
status: experimental
description: >
  Detects Mimikatz in Carbon Black EDR process events: a command line using
  one of its credential modules (sekurlsa:: for LSASS memory, lsadump:: for
  SAM, LSA secrets and DCSync, kerberos::golden for forged tickets, and
  privilege::debug, which it runs first), or a process image named
  mimikatz.exe.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/006/
  - https://attack.mitre.org/techniques/T1558/001/
author: LogTriage
date: 2026/10/19
modified: 2026/10/20
logsource:
  product: carbonblack
  category: process_creation
detection:
  mimikatz_module:
    cmdline|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'kerberos::golden'
      - 'privilege::debug'
  mimikatz_binary:
    path|endswith: '\mimikatz.exe'
  condition: mimikatz_module or mimikatz_binary
falsepositives:
  - Authorized red-team or penetration test (correlate with the engagement)
  - Security tools or test files named mimikatz.exe on analyst machines
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.t1003.006
  - attack.t1558.001
