# Detect Web Attack Tools (sqlmap, Nikto, Nmap) in AWS ALB / ELB Access Logs
# Rule ID: LTR-0019
# Source + explanation: https://logtriage.app/rules/aws-alb-scanner-scripted-access/
# Validated against a real sample log (malicious/alb_attack.log): fires on the malicious sample, silent on the benign one.

title: AWS ALB Request From a Web Attack Tool
id: e5cc82ed-71dc-4762-8692-bc5a536b14eb
status: experimental
description: >
  Detects requests in AWS ALB/ELB access logs whose user agent identifies a
  web attack or scanning tool: sqlmap, Nikto, the Nmap Scripting Engine or
  Acunetix. These tools announce themselves unless the operator changes the
  user agent, so a match is a cheap, high-precision sign of an attack
  attempt.
references:
  - https://attack.mitre.org/techniques/T1595/002/
  - https://attack.mitre.org/techniques/T1190/
author: LogTriage
date: 2026/10/06
modified: 2026/10/20
logsource:
  product: aws
  service: alb
detection:
  attack_tool:
    user_agent|contains:
      - 'sqlmap'
      - 'Nikto'
      - 'Nmap Scripting Engine'
      - 'acunetix'
  condition: attack_tool
falsepositives:
  - Authorized penetration tests from known addresses
  - Subscribed attack-surface scanning services
level: medium
tags:
  - attack.reconnaissance
  - attack.t1595.002
  - attack.initial_access
  - attack.t1190
