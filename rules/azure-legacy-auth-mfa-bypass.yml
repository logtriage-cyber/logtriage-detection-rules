# Detect Legacy-Protocol Sign-Ins With a Correct Password in Entra ID Logs
# Rule ID: LTR-0004
# Source + explanation: https://logtriage.app/rules/azure-legacy-auth-mfa-bypass/
# Validated against a real sample log (malicious/azure_mfa_bypass.json): fires on the malicious sample, silent on the benign one.

title: Entra ID Legacy-Protocol Sign-In With a Correct Password
id: 2f8c5d11-4a7e-4b90-9c33-7e1d6a2b4c04
status: experimental
description: >
  Detects a sign-in over a legacy protocol (Exchange ActiveSync, IMAP4, POP3,
  authenticated SMTP, MAPI over HTTP or "Other clients") where the password was
  accepted: the sign-in succeeded (errorCode 0), or it failed only because MFA
  was required (50074, 50076) or Conditional Access blocked token issuance
  (53003). Legacy protocols cannot complete MFA, so a success means MFA was not
  enforced for that path, and each failure code still proves the password works.
references:
  - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
  - https://attack.mitre.org/techniques/T1078/004/
author: LogTriage
date: 2026/06/23
modified: 2026/10/20
logsource:
  product: azure
  service: signinlogs
detection:
  legacy_client:
    clientAppUsed:
      - 'Other clients'
      - 'Exchange ActiveSync'
      - 'IMAP4'
      - 'POP3'
      - 'Authenticated SMTP'
      - 'MAPI Over HTTP'
  password_accepted:
    status.errorCode:
      - 0
      - 50074
      - 50076
      - 53003
  condition: legacy_client and password_accepted
falsepositives:
  - Old mail clients or line-of-business apps still on basic authentication
  - Documented service accounts on legacy protocols
level: high
tags:
  - attack.initial_access
  - attack.t1078.004
