# Detect Privilege Escalation and Destructive Sabotage in Azure Activity Logs
# Rule ID: LTR-0022
# Source + explanation: https://logtriage.app/rules/azure-activity-privilege-escalation-sabotage/
# Validated against a real sample log (malicious/azure_activity_attack.json): fires on the malicious sample, silent on the benign one.

title: Azure Activity Log — Privilege Escalation and Destructive Sabotage
id: 23e56145-36f5-4e22-b3d5-f8df05fba9a6
status: experimental
description: >
  Detects the three highest-impact control-plane operations an attacker
  performs once they hold a foothold in an Azure subscription: granting a new
  role assignment (durable privilege), deleting a Key Vault secret (destroying
  credentials or covering tracks), and deleting a virtual machine (destructive
  impact). Each is independently rare and meaningful in a healthy environment,
  so any one of them succeeding is worth an alert on its own.
references:
  - https://attack.mitre.org/techniques/T1098/003/
  - https://attack.mitre.org/techniques/T1485/
author: LogTriage
date: 2026/10/12
logsource:
  product: azure
  service: azure.activitylogs
detection:
  role_assignment_grant:
    operationName: 'Microsoft.Authorization/roleAssignments/write'
    status: 'Succeeded'
  keyvault_secret_delete:
    operationName: 'Microsoft.KeyVault/vaults/secrets/delete'
    status: 'Succeeded'
  vm_delete:
    operationName: 'Microsoft.Compute/virtualMachines/delete'
    status: 'Succeeded'
  condition: role_assignment_grant or keyvault_secret_delete or vm_delete
falsepositives:
  - Planned, ticketed role grant during onboarding or break-glass access by a known admin
  - Decommissioning runbook deleting a retired VM and its associated secrets together
level: critical
tags:
  - attack.privilege_escalation
  - attack.impact
  - attack.t1098.003
  - attack.t1485
