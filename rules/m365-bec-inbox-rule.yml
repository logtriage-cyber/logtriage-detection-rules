# Detect Business Email Compromise via Forwarding and Deleting Inbox Rules (Microsoft 365)
# Rule ID: LTR-0006
# Source + explanation: https://logtriage.app/rules/m365-bec-inbox-rule/
# Validated against a real sample log (malicious/m365_bec_data_exfil.json): fires on the malicious sample, silent on the benign one.

title: M365 Inbox Rule or Mailbox Forwarding That Hides or Exfiltrates Mail
id: 4c9d2e83-5b71-4a26-9f18-3e7a1c6b9d06
status: experimental
description: >
  Detects the two Exchange Online changes behind most business email
  compromise: an inbox rule created or changed (New-InboxRule, Set-InboxRule)
  with an action that forwards, redirects or deletes messages, and mailbox
  forwarding set with Set-Mailbox (ForwardingSmtpAddress, ForwardingAddress).
references:
  - https://attack.mitre.org/techniques/T1114/003/
  - https://attack.mitre.org/techniques/T1564/008/
author: LogTriage
date: 2026/06/23
modified: 2026/10/20
logsource:
  product: m365
  service: exchange
detection:
  inbox_rule_hides_or_forwards:
    Operation:
      - 'New-InboxRule'
      - 'Set-InboxRule'
    Parameters|contains:
      - 'ForwardTo'
      - 'ForwardAsAttachmentTo'
      - 'RedirectTo'
      - 'DeleteMessage'
  mailbox_forwarding:
    Operation: 'Set-Mailbox'
    Parameters|contains:
      - 'ForwardingSmtpAddress'
      - 'ForwardingAddress'
  condition: inbox_rule_hides_or_forwards or mailbox_forwarding
falsepositives:
  - Users forwarding mail to a personal or delegate address
  - Admin mailbox forwarding during onboarding, offboarding or migration
level: high
tags:
  - attack.collection
  - attack.t1114.003
  - attack.defense_evasion
  - attack.t1564.008
