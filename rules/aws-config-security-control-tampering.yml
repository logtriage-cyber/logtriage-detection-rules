# Detect CloudTrail Deletion and All-Traffic Security Groups in AWS Config History
# Rule ID: LTR-0020
# Source + explanation: https://logtriage.app/rules/aws-config-security-control-tampering/
# Validated against a real sample log (malicious/aws_config_changes.json): fires on the malicious sample, silent on the benign one.

title: AWS Config CloudTrail Deletion or All-Traffic Security Group
id: 9ac4798c-466d-4f98-a64b-a3561f6eb903
status: experimental
description: >
  Detects two ways of removing a cloud control, as recorded in AWS Config
  configuration items: a CloudTrail trail deleted (the audit log itself), and a
  security group that allows all protocols (ipProtocol -1) from 0.0.0.0/0, which
  removes network containment entirely.
references:
  - https://attack.mitre.org/techniques/T1562/007/
  - https://attack.mitre.org/techniques/T1562/008/
author: LogTriage
date: 2026/10/06
modified: 2026/10/20
logsource:
  product: aws
  service: config
detection:
  cloudtrail_deleted:
    resourceType: 'AWS::CloudTrail::Trail'
    configurationItemStatus: 'ResourceDeleted'
  security_group_open_to_all:
    resourceType: 'AWS::EC2::SecurityGroup'
    ipProtocol: '-1'
    cidrIp: '0.0.0.0/0'
  condition: cloudtrail_deleted or security_group_open_to_all
falsepositives:
  - Planned CloudTrail consolidation into an organization trail
  - Lab or sandbox accounts that tolerate all-traffic security groups
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.007
  - attack.t1562.008
