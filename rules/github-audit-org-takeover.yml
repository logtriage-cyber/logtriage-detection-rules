# Detect Two-Factor Authentication Being Disabled in GitHub Audit Logs
# Rule ID: LTR-0014
# Source + explanation: https://logtriage.app/rules/github-audit-org-takeover/
# Validated against a real sample log (malicious/github_audit_attack.json): fires on the malicious sample, silent on the benign one.

title: GitHub Two-Factor Authentication Disabled
id: 9e2f7b58-4c31-42a6-b7d9-05e8a1c36f4d
status: experimental
description: >
  Detects two-factor authentication being removed in GitHub: the organization's
  two-factor requirement disabled (org.disable_two_factor_requirement, in the
  organization audit log) or two-factor authentication disabled for a user
  account (two_factor_authentication.disabled, in enterprise audit logs and the
  user's security log). Either makes a stolen password enough to sign in.
references:
  - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
  - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events
  - https://attack.mitre.org/techniques/T1556/006/
author: LogTriage
date: 2026/08/04
modified: 2026/10/20
logsource:
  product: github
  service: audit
detection:
  two_factor_removed:
    action:
      - 'org.disable_two_factor_requirement'
      - 'two_factor_authentication.disabled'
  condition: two_factor_removed
falsepositives:
  - Planned organization two-factor policy change (correlate with a ticket)
  - A user moving two-factor authentication to a new device
level: high
tags:
  - attack.credential_access
  - attack.defense_evasion
  - attack.persistence
  - attack.t1556.006
