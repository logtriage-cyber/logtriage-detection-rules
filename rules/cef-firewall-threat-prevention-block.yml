# Detect Blocked Exploits, Spyware and Malware in Palo Alto PAN-OS CEF Logs
# Rule ID: LTR-0024
# Source + explanation: https://logtriage.app/rules/cef-firewall-threat-prevention-block/
# Validated against a real sample log (malicious/cef_firewall_attack.log): fires on the malicious sample, silent on the benign one.

title: Palo Alto PAN-OS Threat Blocked (Exploit, Spyware or Malware)
id: 3a7c9e02-5d14-4f6b-8e2a-0b9f4d1c6a73
status: experimental
description: >
  Detects a Palo Alto PAN-OS threat log in CEF where the firewall matched a
  vulnerability exploit, spyware (command-and-control) or malware signature and
  stopped the traffic. In PAN-OS CEF the header's Device Event Class ID carries
  the threat subtype and its Name is THREAT; the act key carries the action.
  Field names below follow Microsoft Sentinel's CommonSecurityLog table.
references:
  - https://docs.paloaltonetworks.com/resources/cef
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1071/
author: LogTriage
date: 2026/10/19
modified: 2026/10/20
logsource:
  product: paloalto
  service: threat
detection:
  threat_match:
    DeviceVendor: 'Palo Alto Networks'
    Activity: 'THREAT'
    DeviceEventClassID:
      - 'vulnerability'
      - 'spyware'
      - 'virus'
      - 'wildfire-virus'
  blocked:
    DeviceAction:
      - 'drop'
      - 'drop-all-packets'
      - 'reset-both'
      - 'reset-client'
      - 'reset-server'
      - 'block-ip'
  condition: threat_match and blocked
falsepositives:
  - Sanctioned scanner or penetration test from a known source address
  - A signature misfiring on legitimate traffic that resembles attack syntax
level: medium
tags:
  - attack.initial_access
  - attack.t1190
  - attack.command_and_control
  - attack.t1071
