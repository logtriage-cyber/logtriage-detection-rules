# Detect Cobalt Strike Beacons, Mimikatz, and Encoded PowerShell in CrowdStrike Falcon Detections
# Rule ID: LTR-0026
# Source + explanation: https://logtriage.app/rules/crowdstrike-cobalt-strike-mimikatz-encoded-powershell/
# Validated against a real sample log (malicious/crowdstrike_detections.json): fires on the malicious sample, silent on the benign one.

title: Cobalt Strike Beacon, Mimikatz, and Encoded PowerShell in CrowdStrike Falcon
id: 56e5fdb9-ffaa-4f19-a4c7-a2b1ad59b59f
status: experimental
description: >
  Detects four independent high-confidence indicators in CrowdStrike Falcon events:
  a DetectionSummaryEvent naming a Cobalt Strike beacon, a process launched with
  base64-encoded PowerShell, an image file named mimikatz, and a failed logon
  using the ANONYMOUS LOGON account. Any single occurrence warrants investigation.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1071/001/
author: LogTriage
date: 2026/10/19
logsource:
  product: crowdstrike
  service: detections
detection:
  selection_c2_beacon:
    event_simpleName: 'DetectionSummaryEvent'
    DetectName|contains: 'Cobalt Strike'
  selection_encoded_powershell:
    CommandLine|contains: '-enc'
  selection_mimikatz:
    ImageFileName|contains: 'mimikatz'
  selection_anonymous_logon:
    SubjectUserName: 'ANONYMOUS LOGON'
  condition: selection_c2_beacon or selection_encoded_powershell or selection_mimikatz or selection_anonymous_logon
falsepositives:
  - Authorized red team exercise using Cobalt Strike or mimikatz with prior coordination
  - Configuration management tool passing a long argument via -enc
  - Legacy service or device relying on ANONYMOUS LOGON null sessions
level: critical
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.credential_access
  - attack.t1003.001
  - attack.execution
  - attack.t1059.001
