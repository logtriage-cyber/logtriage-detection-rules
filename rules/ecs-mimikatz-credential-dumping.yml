# Detect Mimikatz Credential Dumping in Elastic Common Schema Process Logs
# Rule ID: LTR-0028
# Source + explanation: https://logtriage.app/rules/ecs-mimikatz-credential-dumping/
# Validated against a real sample log (malicious/ecs_attack.json): fires on the malicious sample, silent on the benign one.

title: Mimikatz Process Execution via Process Name or Command-Line Modules
id: 5a3af970-5587-4827-8af6-b761fdb983c1
status: experimental
description: >
  Detects Mimikatz credential-dumping activity in ECS process events, either
  by the process name mimikatz.exe or by the distinctive sekurlsa and
  privilege::debug module invocations in the command line. sekurlsa::logonpasswords
  reads credentials out of LSASS memory, and privilege::debug is the
  standard precursor that elevates the process token to SeDebugPrivilege so
  that read can happen.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/software/S0002/
author: LogTriage
date: 2026/10/26
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process.name: 'mimikatz.exe'
  selection_cmdline:
    process.command_line|contains:
      - 'sekurlsa::logonpasswords'
      - 'privilege::debug'
  condition: selection_process or selection_cmdline
falsepositives:
  - Authorized red team or penetration test engagement with a known ticket
  - Security product testing or EDR validation labs
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.t1003
